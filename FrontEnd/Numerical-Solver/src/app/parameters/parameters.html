<div class="params-container">
    <h3 class="section-title">Method Parameters</h3>

    @if (isIterative) {
    <div class="params-group animate-fade">

        <div class="input-block">
            <label class="param-label">Initial Guess (X₀)</label>
            <div class="guess-grid">
                @for (val of initialGuess(); track i; let i = $index) {
                <div class="guess-item">
                    <span class="guess-label">x{{i+1}}</span>
                    <input type="number" [ngModel]="initialGuess()[i]" (ngModelChange)="updateGuess(i, $event)"
                        class="param-input">
                </div>
                }
            </div>
        </div>

        <div class="input-block">
            <label class="param-label">Stopping Condition</label>
            <select [ngModel]="stopCondition()" (ngModelChange)="stopCondition.set($event)" class="param-select">
                <option value="Number of Iterations">Number of Iterations</option>
                <option value="Absolute Relative Error">Absolute Relative Error</option>
            </select>
        </div>

        @if (stopCondition() === 'Number of Iterations') {
        <div class="input-block">
            <label class="param-label">Max Iterations</label>
            <input type="number" [ngModel]="maxIterations()" (ngModelChange)="maxIterations.set($event)"
                class="param-input-full">
        </div>
        }

        @if (stopCondition() === 'Absolute Relative Error') {
        <div class="input-block">
            <label class="param-label">Epsilon (e.g., 0.0001)</label>
            <input type="number" [ngModel]="tolerance()" (ngModelChange)="tolerance.set($event)" step="0.00001"
                class="param-input-full">
        </div>
        }
    </div>
    }

    @if (method === 'LU Decomposition') {
    <div class="params-group animate-fade">
        <div class="input-block">
            <label class="param-label">Decomposition Form</label>
            <div class="radio-group">
                <label class="radio-option" [class.selected]="luForm() === 'Doolittle'">
                    <input type="radio" name="luForm" value="Doolittle" [ngModel]="luForm()"
                        (ngModelChange)="luForm.set($event)">
                    <span>Doolittle Form</span>
                </label>
                <label class="radio-option" [class.selected]="luForm() === 'Crout'">
                    <input type="radio" name="luForm" value="Crout" [ngModel]="luForm()"
                        (ngModelChange)="luForm.set($event)">
                    <span>Crout Form</span>
                </label>
                <label class="radio-option" [class.selected]="luForm() === 'Cholesky'">
                    <input type="radio" name="luForm" value="Cholesky" [ngModel]="luForm()"
                        (ngModelChange)="luForm.set($event)">
                    <span>Cholesky Form</span>
                </label>
            </div>
        </div>
    </div>
    }

    <!-- Scaling Checkbox: Show for non-iterative methods -->
    @if (!isIterative) {
    <div class="params-group animate-fade">
        <label class="checkbox-container">
            <input type="checkbox" [ngModel]="useScaling()" (ngModelChange)="useScaling.set($event)">
            <span class="checkbox-label">Use Scaling</span>
        </label>
    </div>
    }

    <div class="action-footer">
        <button (click)="emitSolve()" class="solve-btn">
            <span>SOLVE SYSTEM</span>
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6" />
            </svg>
        </button>
    </div>
</div>
